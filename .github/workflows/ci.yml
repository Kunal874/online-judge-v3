name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    # The integration suite runs against a real Postgres — the access-control
    # rules it covers live in Prisma queries, so a fake would prove nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: online_judge_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U judge -d online_judge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://judge:devpassword@localhost:5433/online_judge_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Prisma client is generated code, not checked in — nothing
      # typechecks or runs without this.
      - run: npm run prisma:generate -w server
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
