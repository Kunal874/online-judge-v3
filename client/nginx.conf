server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Serving the API under the same origin as the app is what lets the
    # session cookie stay SameSite=Lax. A separate API domain would force
    # SameSite=None, giving up CSRF protection from the cookie itself.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are app routes, not 404s. index.html
    # itself must never be cached, or users keep booting a stale bundle that
    # references deleted asset files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
