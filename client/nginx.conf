server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Serving the API under the same origin as the app is what lets the
    # session cookie stay SameSite=Lax. A separate API domain would force
    # SameSite=None, giving up CSRF protection from the cookie itself.
    location /api/ {
        # nginx resolves a hostname written directly in proxy_pass exactly
        # once, at startup, and caches the address forever. Recreating the
        # api container gives it a new address on the compose network, and
        # nginx keeps proxying to the old one — every request 502s until
        # nginx happens to be restarted too. Deploying the API would take
        # the site down until someone noticed.
        #
        # Naming the upstream through a variable forces a lookup per
        # request instead, against Docker's embedded DNS server.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "api:8000";

        # proxy_pass with a variable carries no URI part, so it forwards the
        # request URI unchanged — the /api prefix has to be stripped here
        # rather than by the trailing slash this used to rely on.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames change whenever content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are app routes, not 404s. index.html
    # itself must never be cached, or users keep booting a stale bundle that
    # references deleted asset files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
